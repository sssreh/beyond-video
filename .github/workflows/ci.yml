name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ffmpeg/ffprobe are a runtime dependency for most of the export/
      # generate test suite (video/audio probing, trimming, encoding) -
      # installed explicitly rather than relying on whatever happens to
      # already be on the runner image.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package + dev/test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[speech,translate,web]"
          pip install -r requirements-dev.txt

      - name: pytest
        run: pytest

      # ruff/mypy aren't blocking yet - the codebase has never been run
      # through either, so a first pass is likely to surface a real
      # backlog of findings rather than genuine regressions. Left
      # informational (visible in the run's output either way) until
      # that backlog has been triaged; tighten by removing
      # continue-on-error once it's clean.
      - name: ruff
        run: ruff check .
        continue-on-error: true

      - name: mypy
        run: mypy src
        continue-on-error: true
