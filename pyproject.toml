[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-video"
version = "0.2.0"
description = "Open, private, cross-platform dashcam automation."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"

authors = [
    { name = "Christer R. (sssreh)" }
]

keywords = [
    "blackvue",
    "dashcam",
    "automation",
    "synology",
    "python"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "Pillow>=10.0",
]

# bv-download/bv-config/bv-ls/bv-export's core (non-transcribe) work
# only needs the base dependencies above (Pillow, for map/mirror-icon
# image work) - none of these three groups are imported at module
# level anywhere in src/ (see e.g. cli/bv_lang.py, generate/speech.py:
# faster-whisper/pyannote.audio/argostranslate are always imported
# lazily, inside the function that needs them, raising a clean
# MediaToolError if missing), so a plain `pip install .` keeps working
# without any of them - installing an extra only matters once you
# actually run a command that needs it.
[project.optional-dependencies]
# bv-generate --transcribe/--diarize.
speech = [
    "faster-whisper>=1.0",
    "pyannote.audio>=4.0",
]
# bv-generate --translate, bv-lang.
translate = [
    "argostranslate>=1.9",
]
# bv-web and bv-live. Deliberately its own group, not bundled with the
# above - the Docker image bv-web actually runs in (see Dockerfile)
# has no need to pull in faster-whisper/pyannote.audio/argostranslate
# (and torch, transitively) just to serve trip-browsing/live-camera
# pages. bv-live shares this group rather than getting its own: it
# needs the exact same fastapi/uvicorn stack, just for a different
# app (see live/app.py's own docstring for why it's a separate
# top-level package from web/ despite the shared dependency).
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "Jinja2>=3.0",
]

[project.scripts]
bv-ls = "blackvue.cli.bv_ls:main"
bv-download = "blackvue.cli.bv_download:main"
bv-config = "blackvue.cli.bv_config:main"
bv-gps = "blackvue.cli.bv_gps:main"
bv-generate = "blackvue.cli.bv_generate:main"
bv-lang = "blackvue.cli.bv_lang:main"
bv-export = "blackvue.cli.bv_export:main"
bv-web = "blackvue.cli.bv_web:main"
bv-live = "blackvue.cli.bv_live:main"

# setuptools only bundles .py files into the installed wheel by
# default - without this, web/templates/*.html (login.html,
# trip_list.html, ...) silently get left out of `pip install .`,
# which is exactly what happened on the real NAS install: bv-web
# imported and ran fine, but every page 500'd with
# jinja2.exceptions.TemplateNotFound the moment it tried to render
# one, since site-packages/blackvue/web/templates/ didn't exist at
# all.
[tool.setuptools.package-data]
"blackvue.web" = ["templates/*.html"]
# The bundled default --stitch-mirror-icon photo (mirror_icon.py's
# DEFAULT_MIRROR_ICON_PATH) - same reasoning as templates/*.html
# above: without this, `pip install .` silently drops it, and the
# default only works from inside a repo checkout instead of any real
# install (Dockerfile.cli, a PC pip install, ...).
#
# assets/*.ttf (DejaVuSans-Bold.ttf) and the accompanying
# LICENSE_DEJAVU.txt: the bundled Unicode-capable font used by
# map_render.py and gsensor_graph_render.py to draw text (street
# names, etc.) that can contain non-ASCII characters like Swedish
# a-ring, a-umlaut, o-umlaut. Before this, both modules only tried a
# Linux system font path and a bare filename, both of which are
# absent on Christer's Windows machine and in the ffmpeg-only
# Dockerfile.cli image, so they silently fell back to PIL's built-in
# default font - which has no a/a/o glyphs at all and rendered them
# as blank boxes. Same package-data lesson as templates/*.html: a
# file sitting in the repo's assets/ folder isn't enough by itself,
# it must be listed here too or a real install drops it.
#
# assets/*.mp4 used to be listed here too, for the six bundled
# Kling-generated "no parking" clips the removed --parking-transition
# -clip default pool used - dropped along with that whole feature
# (see WORKING_CONTEXT.md); no .mp4 assets remain in this folder.
"blackvue.export" = ["assets/*.png", "assets/*.ttf", "assets/*.txt"]

# tests/ has no __init__.py anywhere, so more than one test file across
# different directories can end up sharing a basename (e.g.
# tests/blackvue/generate/test_subtitles.py and
# tests/blackvue/export/test_subtitles.py both legitimately exist,
# testing two different modules). Pytest's default import mode
# ("prepend") derives each test module's import name from just its
# basename and errors with "import file mismatch" the moment two
# same-named files are collected in the same run. --import-mode
# =importlib imports each file by its actual path instead, so same-
# basename files never collide - pytest's own recommended fix for
# this, and avoids sprinkling __init__.py across every tests/
# subdirectory just to route around it.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
