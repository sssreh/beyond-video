# Explicit version key on purpose: Synology's Container Manager only
# ships the old standalone docker-compose 1.x CLI over SSH (no
# `docker compose` v2 plugin) - without a version key, that CLI reads
# this file as the legacy Compose v1 format (top-level keys are
# service names directly, no `services:` wrapper), which would
# misread everything below as one oddly-named service. "3.8" is a
# Compose file format docker-compose 1.28.5 (Christer's version)
# understands and that supports everything used here.
version: "3.8"

services:
  bv-web:
    build: .
    container_name: beyond-video-web
    restart: unless-stopped
    ports:
      - "19373:19373"
    environment:
      # See core/camera_config.py's own comment on this variable: it
      # points default_config_dir() (used by both the camera pick-list/
      # archive browser and the in-process bv-config/bv-gps job runner)
      # at the SAME host folder bv-cli's `docker-compose run` commands
      # use via their explicit --config-dir /data/config - without
      # this, bv-web's container has no persistent $HOME, so it sees
      # zero cameras no matter how many are actually configured.
      - BEYOND_VIDEO_CONFIG_DIR=/data/camera-config
      # See web/users.py's own comment on this variable: without it,
      # `bv-web adduser` run without an explicit --users-file flag
      # falls back to $HOME/.config/beyond-video/web-users.cfg, which
      # inside this container is /root/.config/... - a path nothing
      # mounts, so the account "succeeds" and then vanishes on the
      # next `docker-compose run`/rebuild, while `serve` (which reads
      # /data/config/web-users.cfg, the ./data/config mount below)
      # never sees it. Confirmed on Christer's NAS: adduser created
      # /root/.config/beyond-video/web-users.cfg, serve looked in
      # /data/config. This makes adduser and serve agree on the same
      # file by default, with no flag required on either subcommand.
      - BEYOND_VIDEO_USERS_FILE=/data/config/web-users.cfg
    volumes:
      # The trip archive bv-export writes into (--target). Read-write:
      # bv-web's own job runner can trigger bv-export directly (its
      # "Export trips" job), which writes here from inside this
      # container - not just the archive browser reading trips written
      # elsewhere. Point bv-export --target at the same host path
      # (left of the colon) whether it's run from here, from bv-cli,
      # or from Christer's PC over SMB, so exported trips show up in
      # all three places.
      - ./data/trips:/data/trips
      # The raw camera archive - bv-download's target, i.e. every
      # camera .cfg's `target` field (see core/camera_config.py). The
      # archive-browser feature (app.py's /archive routes,
      # _find_camera_archive()/scan_archive()) reads straight from
      # this path, NOT from ./data/trips - a camera id names a
      # *source* archive, a trip id names *processed* output. The SAME
      # host folder bv-cli's own ./data/archive mount below points at,
      # so a recording bv-cli downloads is visible here too. Read-write:
      # bv-web's job runner can trigger bv-download/bv-generate here
      # directly, both of which write into this same folder - a plain
      # read-only mount broke that with "Read-only file system" the
      # first time bv-generate was triggered from the web UI on the
      # NAS (see WORKING_CONTEXT.md).
      - ./data/archive:/data/archive
      # bv-web's accounts file (web-users.cfg) - read-write, and kept
      # outside the image so it survives `docker-compose build`/
      # container recreation. Created empty on first run; populate it
      # with `docker exec -it beyond-video-web bv-web adduser ...`
      # (see docs/DEPLOY.md).
      - ./data/config:/data/config
      # Camera .cfg files - the SAME host folder bv-cli's own
      # ./data/camera-config mount below points at, so a camera set up
      # from bv-web's own "Trigger bv-config" job (or from the CLI via
      # bv-cli) is visible to both. Read-write: bv-web's job runner can
      # create/edit a camera's config through its own UI, not just read
      # one bv-cli already wrote.
      - ./data/camera-config:/data/camera-config

  # The full bv-* pipeline (bv-config, bv-download, bv-generate,
  # bv-lang, bv-export) - see docs/DEPLOY.md's "Feeding it real trips"
  # section. Christer also runs bv-generate/bv-export natively on his
  # PC against these same folders over an SMB-mapped drive (faster -
  # GPU acceleration), and can now also trigger them from bv-web's own
  # job-runner UI (see the bv-web service above - its image and mounts
  # gained the same write access and toolchain this service has, for
  # exactly that reason). None of these three ways replaces the
  # others; this service in particular lets the NAS do the whole
  # pipeline unattended (e.g. scheduled) without a browser involved at
  # all. Not a long-running service like bv-web: no `restart:` policy
  # and no fixed command here on purpose - invoke it per command with
  # `docker-compose run --rm bv-cli <command> ...`, e.g.
  # `docker-compose run --rm bv-cli bv-download Kirby`.
  bv-cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    volumes:
      # bv-download's target / bv-config's "Target (download path)" -
      # the raw camera archive. This is the SAME host folder Christer's
      # PC also reaches over SMB (see docs/DEPLOY.md) and the SAME
      # host folder bv-web's own ./data/archive mount above now also
      # points at read-write, so all three ways of running
      # bv-download/bv-generate see and write the same files.
      - ./data/archive:/data/archive
      # bv-export's --target - the SAME host folder bv-web's own
      # `./data/trips` mount above points at (also read-write now, for
      # the same reason) and that Christer's PC also reaches over SMB,
      # so a trip exported from any of the three places shows up in
      # bv-web immediately.
      - ./data/trips:/data/trips
      # Camera .cfg files (bv-config --config-dir) - deliberately a
      # different host folder than bv-web's ./data/config above (that
      # one holds web-users.cfg, an unrelated file); both happen to
      # land at /data/config inside their own separate containers,
      # which is fine since containers don't share a filesystem.
      - ./data/camera-config:/data/config
